<!DOCTYPE html>
<html lang="ms" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>BizPro v6 — Utama</title>

    /* ---------- Layout utama ---------- */
    .shell {
      max-width: 1180px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 110px);
      perspective: 1400px;
    }

    /* Status bar */
    .statusbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-radius: 999px; margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 10px;
      background: conic-gradient(from 200deg, var(--flux-amber), var(--flux-coral), var(--flux-violet), var(--flux-cyan), var(--flux-amber));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
    }
    .brand small { font-weight: 500; color: var(--text-faint); margin-left: 2px; }
    .status-right { display: flex; align-items: center; gap: 6px; }
    .guardian-chip {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; border-radius: 999px; font-size: .78rem;
      background: var(--glass); border: 1px solid var(--glass-edge);
    }
